name: ENERGUN METAL CORE fast regression

on:
  push:
    branches:
      - energun-metal-core
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - energun-metal-core
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energun-metal-core-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal-core-host:
    name: Focused Metal Core host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Python build dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('tools/build.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-

      - name: Install header-generation dependencies
        run: python -m pip install --upgrade Pillow fonttools

      - name: Set up host compiler
        run: |
          cc --version
          python3 --version

      - name: Run focused ENERGUN METAL CORE regression
        run: sh tests/run_metal_core_fast.sh

      - name: Run dependency-aware parallel CP1 persistence test queue
        id: cp1-queue
        run: python3 tests/run_cp1_test_queue.py

      - name: Test CP0-CP7 development orchestrator planner
        run: python3 tests/test_development_orchestrator.py

      - name: Generate CP0-CP7 development dispatch plan
        run: python3 tests/run_development_orchestrator.py

      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energun-metal-core-fast-${{ github.sha }}
          path: |
            build/metal-core-fast/
            build/cp1-test-queue/
            build/development-orchestrator/
          if-no-files-found: ignore
          retention-days: 14
