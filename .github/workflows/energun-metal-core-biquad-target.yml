name: ENERGUN METAL CORE biquad target codegen probe

on:
  pull_request:
    branches:
      - energun-metal-core
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energun-metal-core-biquad-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biquad-target:
    name: AC79 pi32v2 biquad compile-only probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned JieLi pi32v2 toolchain
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" --version

      - name: Compile and inspect the isolated biquad candidate
        run: |
          set -euo pipefail
          mkdir -p build/metal-core-biquad-target
          TC="$HOME/.jieli/toolchain"
          "$TC/pi32v2/bin/clang" -target pi32v2 -Os -ffunction-sections -fno-builtin \
            -Wall -Wextra -Werror -Itests \
            -c tests/metal_core_biquad_target_probe.c \
            -o build/metal-core-biquad-target/biquad_probe.o
          "$TC/common/bin/objdump" -d build/metal-core-biquad-target/biquad_probe.o \
            > build/metal-core-biquad-target/biquad_probe.dis
          "$TC/common/bin/objdump" -t build/metal-core-biquad-target/biquad_probe.o \
            > build/metal-core-biquad-target/biquad_probe.symbols
          grep -q "eng_metal_biquad_target_probe_sample" build/metal-core-biquad-target/biquad_probe.dis
          grep -q "eng_metal_biquad_target_probe_block32" build/metal-core-biquad-target/biquad_probe.dis
          grep -q "eng_metal_biquad_target_probe_state_size" build/metal-core-biquad-target/biquad_probe.dis
          {
            echo "## AC79 biquad code-generation probe"
            echo "The isolated Q2.30 DF2T sample and block-32 functions compiled with the pinned pi32v2 compiler."
            echo "Object, disassembly and symbol table are archived. This is compile-only evidence, not hardware execution or cycle timing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload target codegen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energun-metal-core-biquad-target-${{ github.sha }}
          path: build/metal-core-biquad-target/
          if-no-files-found: ignore
          retention-days: 14
