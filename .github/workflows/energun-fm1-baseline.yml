name: ENERGUN FM-1 CORE baseline build

on:
  push:
    branches:
      - energun-metal-core
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - energun-metal-core
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  AC79_SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13
  AC79_SDK_COMMIT: d179b4484759423312073f5fbb232501aa491047
  AC79_SDK_URL: https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git

concurrency:
  group: energun-fm1-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Linux x86-64 firmware build and host regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out branch and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record source and submodule revisions
        run: |
          git rev-parse HEAD
          git submodule status --recursive
          git status --short --branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Python build dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('tools/build.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-

      - name: Set up Node.js for web regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build-time Python dependencies
        run: python -m pip install --upgrade Pillow fonttools

      - name: Install JieLi pi32v2 toolchain
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" --version

      - name: Restore pinned JieLi AC79 SDK cache
        id: ac79-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/fw-AC79_AIoT_SDK
          key: ${{ runner.os }}-ac79-sdk-${{ env.AC79_SDK_COMMIT }}

      - name: Fetch and verify pinned JieLi AC79 SDK
        id: ac79-sdk
        timeout-minutes: 65
        run: |
          set -euo pipefail
          SDK_DIR="$HOME/fw-AC79_AIoT_SDK"
          EXPECTED_COMMIT="$AC79_SDK_COMMIT"

          if [ -d "$SDK_DIR/.git" ]; then
            CACHED_COMMIT="$(git -C "$SDK_DIR" rev-parse HEAD)"
            if [ "$CACHED_COMMIT" != "$EXPECTED_COMMIT" ]; then
              echo "Cached SDK commit mismatch: $CACHED_COMMIT"
              rm -rf "$SDK_DIR"
            fi
          elif [ -e "$SDK_DIR" ]; then
            rm -rf "$SDK_DIR"
          fi

          if [ ! -d "$SDK_DIR/.git" ]; then
            mkdir -p "$SDK_DIR"
            git -C "$SDK_DIR" init
            git -C "$SDK_DIR" remote add origin "$AC79_SDK_URL"

            FETCHED=0
            for ATTEMPT in 1 2 3; do
              echo "AC79 SDK fetch attempt $ATTEMPT/3 (pinned tag: $AC79_SDK_TAG)"
              if timeout 20m git -C "$SDK_DIR" \
                -c http.version=HTTP/1.1 \
                -c http.lowSpeedLimit=1024 \
                -c http.lowSpeedTime=60 \
                fetch --depth=1 --no-tags origin \
                "refs/tags/$AC79_SDK_TAG:refs/tags/$AC79_SDK_TAG"; then
                FETCHED=1
                break
              fi
              echo "Fetch attempt $ATTEMPT failed."
              if [ "$ATTEMPT" -lt 3 ]; then
                sleep $((ATTEMPT * 15))
              fi
            done

            if [ "$FETCHED" -ne 1 ]; then
              echo "::error::Unable to fetch the pinned AC79 SDK tag after 3 attempts."
              exit 1
            fi

            git -C "$SDK_DIR" checkout --detach "$EXPECTED_COMMIT"
          fi

          ACTUAL_COMMIT="$(git -C "$SDK_DIR" rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::AC79 SDK revision mismatch. Expected $EXPECTED_COMMIT, got $ACTUAL_COMMIT"
            exit 1
          fi

          test -f "$SDK_DIR/cpu/wl82/tools/uboot.boot"
          echo "Verified AC79 SDK commit: $ACTUAL_COMMIT"
          git -C "$SDK_DIR" log -1 --format='SDK commit: %H%nSDK subject: %s'
          echo "AC79_SDK=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Save pinned JieLi AC79 SDK cache
        if: steps.ac79-sdk.outcome == 'success' && steps.ac79-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/fw-AC79_AIoT_SDK
          key: ${{ runner.os }}-ac79-sdk-${{ env.AC79_SDK_COMMIT }}

      - name: Build unmodified Felucca firmware
        run: ./build.sh

      - name: Compile ENERGUN VCA with AC79 target compiler
        run: |
          set -euo pipefail
          mkdir -p build/metal-core-vca-target
          TC="$HOME/.jieli/toolchain"
          "$TC/pi32v2/bin/clang" -target pi32v2 -Os -ffunction-sections -fno-builtin \
            -Wall -Wno-unused-function -Ifirmware/src \
            -c tests/metal_core_vca_target_probe.c \
            -o build/metal-core-vca-target/vca_probe.o
          "$TC/common/bin/objdump" -d build/metal-core-vca-target/vca_probe.o \
            > build/metal-core-vca-target/vca_probe.dis
          "$TC/common/bin/objdump" -t build/metal-core-vca-target/vca_probe.o \
            > build/metal-core-vca-target/vca_probe.symbols
          grep -q "eng_metal_vca_target_probe_process" build/metal-core-vca-target/vca_probe.dis
          grep -q "eng_metal_vca_target_probe_block32" build/metal-core-vca-target/vca_probe.dis
          "$TC/pi32v2/bin/clang" -target pi32v2 -Os -ffunction-sections -fno-builtin -Wall -Wno-unused-function -Ifirmware/src -c tests/metal_core_vca_harness_target_probe.c -o build/metal-core-vca-target/vca_harness_probe.o
          "$TC/common/bin/objdump" -d build/metal-core-vca-target/vca_harness_probe.o > build/metal-core-vca-target/vca_harness_probe.dis
          "$TC/common/bin/objdump" -t build/metal-core-vca-target/vca_harness_probe.o > build/metal-core-vca-target/vca_harness_probe.symbols
          grep -q "eng_metal_vca_harness_target_sample" build/metal-core-vca-target/vca_harness_probe.dis
          grep -q "eng_metal_vca_harness_target_block32" build/metal-core-vca-target/vca_harness_probe.dis

          # Feedback-delay candidate probe: compile-only, no hardware execution.
          "$TC/pi32v2/bin/clang" -target pi32v2 -Os -ffunction-sections -fno-builtin \
            -Wall -Wno-unused-function -Ifirmware/src -Itests \
            -c tests/metal_core_feedback_delay_target_probe.c \
            -o build/metal-core-vca-target/feedback_delay_probe.o
          "$TC/common/bin/objdump" -d build/metal-core-vca-target/feedback_delay_probe.o \
            > build/metal-core-vca-target/feedback_delay_probe.dis
          "$TC/common/bin/objdump" -t build/metal-core-vca-target/feedback_delay_probe.o \
            > build/metal-core-vca-target/feedback_delay_probe.symbols
          grep -q "eng_metal_feedback_target_probe_interpolate" build/metal-core-vca-target/feedback_delay_probe.dis
          grep -q "eng_metal_feedback_target_probe_gain_q15" build/metal-core-vca-target/feedback_delay_probe.dis
          grep -q "eng_metal_feedback_target_probe_write" build/metal-core-vca-target/feedback_delay_probe.dis

          {
            echo "## ENERGUN VCA target code generation"
            echo "AC79 pi32v2 compile-only probes passed; VCA state is 36 bytes and eight-voice state is 288 bytes."
            echo 'Isolated VCA, combined VCA + host-ramp, and feedback-delay candidate disassembly and symbol tables are included in the workflow artifact.'
            echo "Feedback-delay probe is compile/codegen evidence only; it is not linked into firmware and is not executed on hardware."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Felucca host and web regression tests
        run: tests/run_tests.sh

      - name: Record build outputs and sizes
        if: always()
        run: |
          {
            echo "## Build outputs"
            for f in build/felucca.bin build/loader/ota.bin build/felucca.fwsc; do
              if [ -f "$f" ]; then
                ls -lh "$f"
                sha256sum "$f"
              else
                echo "Not produced: $f"
              fi
            done
            echo
            echo "## Toolchain"
            "$HOME/.jieli/toolchain/pi32v2/bin/clang" --version || true
            echo
            echo "## Submodules"
            git submodule status --recursive || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experimental build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energun-fm1-baseline-${{ github.sha }}
          path: |
            build/felucca.bin
            build/loader/ota.bin
            build/felucca.fwsc
            build/release-*/SHA256SUMS
            build/metal-core-vca-target/*
          if-no-files-found: ignore
          retention-days: 14
